# The tools the macOS jobs need on a GitHub-hosted runner: Go, and for the
# Ghostty and speech builds, Zig and Xcode's Metal toolchain. The Ghostty
# libraries are cached, keyed like scripts/build-ghostty.sh's own cache.
# With cache "false" (the release build), Go, Zig and the speech helper start
# from nothing and are built from source, and so is Ghostty with ghostty "true".
# With ghostty "prebuilt", the Ghostty libraries are the prebuilt ones pinned in
# scripts/ghostty-prebuilt.pin, checked by SHA-256: a release ships those, so
# nothing it ships comes from a cache.
name: macos-tools
description: Go, Zig, the Metal toolchain and the cached Ghostty and speech builds
inputs:
  ghostty:
    description: '"true" builds libghostty, or restores it from the cache. "prebuilt" installs the pinned, hash-checked libraries'
    default: "false"
  metal:
    description: Install Xcode's Metal toolchain
    default: "false"
  speech:
    description: Restore (or save) the speech helper build
    default: "false"
  cache:
    description: Use caches. With "false", Go, Zig, the speech helper and Ghostty (with ghostty "true") are built from source
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache == 'true' }}
    - name: install the Metal toolchain
      if: inputs.metal == 'true' || inputs.ghostty != 'false' || inputs.speech == 'true'
      shell: bash
      run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
    # Ghostty v1.4.0 builds with this Zig (scripts/build-ghostty.sh).
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      if: inputs.ghostty == 'true'
      with:
        version: 0.17.0
        use-cache: ${{ inputs.cache == 'true' }}
    - name: name the Ghostty cache
      if: inputs.ghostty == 'true' && inputs.cache == 'true'
      id: ghostty
      shell: bash
      run: echo "key=ghostty-$(zig version)-sdk$(xcrun --show-sdk-version)-${{ hashFiles('scripts/build-ghostty.sh') }}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.ghostty == 'true' && inputs.cache == 'true'
      with:
        path: ~/.cache/agent-command/ghostty
        key: ${{ steps.ghostty.outputs.key }}
    - name: build libghostty
      if: inputs.ghostty == 'true'
      shell: bash
      run: scripts/build-ghostty.sh
    - name: install the prebuilt libghostty
      if: inputs.ghostty == 'prebuilt'
      shell: bash
      run: scripts/build-ghostty.sh --prebuilt
    # The speech helper takes about 10 minutes to build (MLX and its Metal
    # shaders) and rarely changes, so its build is cached, keyed on its sources,
    # the Makefile that builds it, and Xcode's version. make speech-helper uses
    # it, or fills it. Without SPEECH_CACHE, it builds from source.
    # SPEECH_CACHE goes in the job's environment, as make reads it in later
    # steps. The value is a fixed path, with nothing from outside in it.
    - name: name the speech helper cache
      if: inputs.speech == 'true' && inputs.cache == 'true'
      id: speech
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "key=acmd-speech-$(xcodebuild -version | tr -s '\n ' '-')${{ hashFiles('helpers/acmd-speech/Package.swift', 'helpers/acmd-speech/Package.resolved', 'helpers/acmd-speech/Sources/**', 'Makefile') }}" >> "$GITHUB_OUTPUT"
        echo "SPEECH_CACHE=$HOME/.cache/agent-command/speech" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.speech == 'true' && inputs.cache == 'true'
      with:
        path: ~/.cache/agent-command/speech
        key: ${{ steps.speech.outputs.key }}
