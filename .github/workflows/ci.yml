# PR checks (SPEC §13.4). Runs on pull requests only: pushes to main are
# re-verified by the release gate before anything is published, which keeps
# macOS minutes within the free allowance.
name: ci

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Restore/save split: actions/cache only saves on job success, so a failing
      # later step would otherwise force a full tool rebuild (~4 min) next run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools-cache
        with:
          path: bin
          key: tools-golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod') }}
      - name: build tools (cache miss)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: make bin/golangci-lint
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: bin
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - run: make lint

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Restore/save split: actions/cache only saves on job success, so a failing
      # later step would otherwise force a full tool rebuild (~4 min) next run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools-cache
        with:
          path: bin
          key: tools-govulncheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod') }}
      - name: build tools (cache miss)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: make bin/govulncheck
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: bin
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - run: make vuln

  # One macOS job (one VM boot, one cache restore): macOS minutes bill at 10x.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags/history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Restore/save split: actions/cache only saves on job success, so a failing
      # later step would otherwise force a full tool rebuild (~4 min) next run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools-cache
        with:
          path: bin
          key: tools-all-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod') }}
      - name: build tools (cache miss)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: make tools
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: bin
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: test (race + coverage gate)
        run: make test
      - name: fuzz (short)
        run: make fuzz FUZZTIME=15s
      - name: snapshot release build
        run: make snapshot
      - name: formula install + brew test
        run: make formula-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-darwin-all
          path: dist/*_darwin_all.tar.gz
          retention-days: 3
