# PR checks (SPEC §13.4). Runs on pull requests only: pushes to main are
# re-verified by the release gate before anything is published.
# All jobs run on the self-hosted runner on the maintainer's Mac (label
# `acmd`), which isn't metered (SPEC §13.6). Dependabot PRs only run once
# the `ok-to-test` label is added: they'd execute updated dependencies on
# that Mac.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, acmd]
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the self-hosted runner keeps Go's caches between runs
      - run: make lint

  vuln:
    runs-on: [self-hosted, acmd]
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the self-hosted runner keeps Go's caches between runs
      - run: make vuln

  # The macOS-only steps (snapshot, brew formula check).
  macos:
    runs-on: [self-hosted, acmd]
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags/history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the self-hosted runner keeps Go's caches between runs
      - name: test (race + coverage gate)
        run: make test
      - name: fuzz (short)
        run: make fuzz FUZZTIME=15s
      - name: snapshot release build
        run: make snapshot
      - name: formula install + brew test
        run: make formula-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-darwin-all
          path: dist/*_darwin_all.tar.gz
          retention-days: 3
