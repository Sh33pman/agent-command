# PR checks (SPEC §13.4). Runs on pull requests only: pushes to main are
# re-verified by the release gate before anything is published.
# All jobs run on the self-hosted runner on the maintainer's Mac (label
# `acmd`), which isn't metered (SPEC §13.6). Dependabot PRs only run once
# the `ok-to-test` label is added: they'd execute updated dependencies on
# that Mac.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:


permissions:
  contents: read

# Release PRs only change the version and changelog, and the release gate runs every
# check on the same commit, so the jobs below skip them.
# Label events other than ok-to-test (e.g. release-please's "autorelease:
# pending") start a run whose jobs all skip; they get their own group so
# they can't cancel the real run for the same commit.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ok-to-test' && '-label' || '' }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, acmd]
    if: >-
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the self-hosted runner keeps Go's caches between runs
      - run: make lint

  swift:
    runs-on: [self-hosted, acmd]
    if: >-
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: speech engine unit tests + release build
        run: make speech-test speech-helper

  vuln:
    runs-on: [self-hosted, acmd]
    if: >-
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the self-hosted runner keeps Go's caches between runs
      - run: make vuln secrets

  # The macOS-only steps (snapshot, brew formula check).
  macos:
    runs-on: [self-hosted, acmd]
    if: >-
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags/history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the self-hosted runner keeps Go's caches between runs
      - name: test (race + coverage gate)
        run: make test
      - name: fuzz (short)
        run: make fuzz FUZZTIME=15s
      - name: build the app
        run: |
          scripts/build-ghostty.sh
          scripts/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-darwin-all
          path: dist/*_darwin_all.tar.gz
          retention-days: 3
