# PR checks, also run on main. Every PR runs every check, so the required checks always report.
# They run on GitHub-hosted runners: the repo is public, so a PR from a fork
# runs nowhere but there. Release PRs, and the release commits they merge as,
# only change the version and changelog, and the release gate runs every check
# on that commit, so the jobs skip them: that also leaves the Mac runners free
# for the release. A PR counts as the release PR only if it is from a branch of
# this repo, named release-please--, and opened by the release App. The branch
# name alone would let anyone's PR skip every check, as GitHub counts a skipped
# required check as passed.
#
# Only what needs a Mac runs on one: GitHub runs a few Mac jobs at a time, and
# a PR that fills them makes the next push, merge or release wait. lint, vuln
# and fuzz run on Ubuntu. lint and vuln check the macOS build from there
# (CHECK_GOOS=darwin), and the linux job checks the Linux one. The linux-distro
# jobs build and test on Debian and Arch.
name: ci

on:
  pull_request:
  # Runs on main too: GitHub only shares caches from the default branch, so
  # this is what lets PRs reuse the Ghostty build. It also checks main after
  # each merge.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces the run before it. On main a run that has started
# is left to finish: it is what fills the caches PRs use, and what checks the
# merge. Runs on main go one at a time, and a run still waiting gives way to a
# newer one, so they never pile up on the Mac runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: lint the macOS build
        run: make lint CHECK_GOOS=darwin

  swift:
    runs-on: macos-26
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
        with:
          metal: "true"
          speech: "true"
      - name: speech engine unit tests + release build
        run: make speech-test speech-helper

  vuln:
    runs-on: ubuntu-latest
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: scan the macOS build for known vulnerabilities
        run: make vuln CHECK_GOOS=darwin
      - name: scan the history for secrets
        run: make secrets

  # The fuzz targets are plain Go with no build tags, so they don't need a Mac.
  fuzz:
    runs-on: ubuntu-latest
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fuzz (short)
        run: make fuzz FUZZTIME=15s

  # What needs a Mac: the Go tests, the libghostty and app tests, the cask check
  # and a signed build of the app.
  macos:
    runs-on: macos-26
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The prebuilt Ghostty libraries a release ships, so a PR that changes the
      # Ghostty pin without a new archive fails here, not at the release.
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "prebuilt"
          speech: "true"
      - name: test (race + coverage gate)
        run: make test
      - name: test with libghostty, and test the app
        run: make test-vt test-app
      # A mistake in the cask template would otherwise first show up when a user
      # runs brew upgrade, after a release.
      - name: check the Homebrew cask
        run: make check-cask
      # Signed the way a release signs it, with a throwaway certificate, so a
      # release is never the first time signing runs on a fresh runner.
      - name: build the app, signed with a throwaway certificate
        run: |
          scripts/create-signing-cert.sh "$RUNNER_TEMP/cert" >/dev/null
          SIGNING_P12="$(cat "$RUNNER_TEMP/cert/signing.p12.base64")" \
          SIGNING_PASSWORD="$(cat "$RUNNER_TEMP/cert/signing.password")" \
            scripts/import-signing-cert.sh "$RUNNER_TEMP/signing.keychain-db" > "$RUNNER_TEMP/signing.env"
          rm -rf "$RUNNER_TEMP/cert"
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          ACMD_SIGN_KEYCHAIN="$KEYCHAIN" scripts/build-app.sh
          codesign --verify --strict "dist/Agent Command.app"
          codesign -dvv "dist/Agent Command.app" 2>&1 | grep -F "Authority=Agent Command Self-Signed"
          security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No Zig cache: it saves about 400 MB under a new key every run, which filled
      # the repo's 10 GB of caches and pushed out the ones that matter (Ghostty's,
      # cached below). The Ghostty build is what Zig's cache would have saved.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: name the Ghostty cache
        id: ghostty
        run: echo "key=ghostty-linux-$(zig version)-${{ hashFiles('scripts/build-ghostty.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agent-command/ghostty
          key: ${{ steps.ghostty.outputs.key }}
      - name: build libghostty-vt
        run: scripts/build-ghostty.sh
      - name: lint
        run: make lint
      # The vuln job scans the macOS build. This scans the Linux one: govulncheck
      # only follows the code of the platform it builds for.
      - name: scan the Linux build for known vulnerabilities
        run: make vuln
      - name: test (race + coverage gate)
        run: make test
      - name: test with libghostty-vt
        run: make test-vt
      - name: test the Linux UI's daemon client and preferences
        run: make test-ui-core
      - name: build
        run: make build

  # The two ends of what Linux users run: Debian stable ships older libraries
  # and tools than Ubuntu, and Arch newer ones. Go and Zig are the pinned
  # versions everywhere; the C compiler, linker and C libraries are the
  # distribution's. These jobs report, and aren't required: Arch changes daily.
  linux-distro:
    name: linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    # Not pinned to a digest on purpose: the job exists to follow what the two
    # distributions ship today.
    container: ${{ matrix.image }} # zizmor: ignore[unpinned-images]
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable
          - distro: arch
            image: archlinux:latest
    steps:
      # Before the checkout: without git, it downloads an archive with no history.
      # procps is ps, which a Debian install has and its container image doesn't.
      - name: install the build tools (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git make gcc g++ pkg-config xz-utils procps
      - name: install the build tools (Arch)
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm --needed base-devel git curl xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container runs as root, and the checkout belongs to the runner's
      # user, so git refuses it. go build then fails: it asks git for the version.
      - name: let git use the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No Zig cache: it saves about 400 MB under a new key every run, which filled
      # the repo's 10 GB of caches and pushed out the ones that matter (Ghostty's,
      # cached below). The Ghostty build is what Zig's cache would have saved.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # A cache of its own: a library built on one distribution isn't the test
      # of another.
      - name: name the Ghostty cache
        id: ghostty
        env:
          DISTRO: ${{ matrix.distro }}
        run: echo "key=ghostty-$DISTRO-$(zig version)-${{ hashFiles('scripts/build-ghostty.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agent-command/ghostty
          key: ${{ steps.ghostty.outputs.key }}
      - name: build libghostty-vt
        run: scripts/build-ghostty.sh
      - name: test (race + coverage gate)
        run: make test
      - name: test with libghostty-vt
        run: make test-vt
      - name: build
        run: make build
