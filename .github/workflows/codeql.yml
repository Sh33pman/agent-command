# CodeQL code scanning, in place of GitHub's default setup. That one's Swift
# autobuild couldn't build the app (it has no Ghostty library), so it scanned
# the speech helper's dependencies instead: about 40 minutes a PR, and none of
# it the app's code.
#
# Here Swift builds the app on the cached Ghostty build, and the speech helper's
# own code (SpeechCore, which has no dependencies). The helper's executable needs
# MLX, a long build of other people's code, so it's scanned on main and weekly.
# Go is analyzed for macOS (GOOS=darwin), so its darwin-only files count, on a
# Linux runner, which keeps the Mac runners free.
#
# The release PR (from a release-please-- branch of this repo, opened by the
# release App) and the release commit are not scanned: they only change the
# version and changelog. A PR that merely uses such a branch name is scanned.
#
# The Swift scan holds a Mac runner for 17 to 34 minutes. A PR gets it only when
# it changes Swift code or how Swift is scanned: a PR with no Swift changes has
# no Swift to scan, and main and the weekly run still scan everything.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses what to scan. When it is skipped, so is analyze.
  plan:
    # Release PRs and commits only change the version and changelog. As in ci.yml,
    # only the real release PR skips: not any PR from a branch with that name.
    if: >-
      !(startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == 'brettmostert-release[bot]')
      && !startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: choose the languages to scan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          swift=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Renames count under both names. If the list can't be read, Swift is scanned.
            if files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')"; then
              if ! grep -qE '^(app/|helpers/|\.github/workflows/codeql\.yml$|\.github/actions/macos-tools/)' <<<"$files"; then
                swift=false
              fi
            fi
          fi
          echo "scan Swift: $swift"
          matrix="$(jq -cn --argjson swift "$swift" '{include: ([
              {language: "actions", "build-mode": "none", runner: "ubuntu-latest"},
              {language: "go", "build-mode": "autobuild", runner: "ubuntu-latest"}
            ] + (if $swift then [{language: "swift", "build-mode": "manual", runner: "macos-26"}] else [] end))}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.language == 'swift' && 75 || 20 }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Before CodeQL starts watching: the Ghostty build is Zig, not ours to scan.
      - if: matrix.language == 'swift'
        uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          GOOS: darwin
          CGO_ENABLED: "0"
      - name: build the app and the speech helper's own code
        if: matrix.language == 'swift'
        run: |
          # CodeQL's tracer runs the build under Rosetta, as x86_64; the Ghostty
          # library is arm64 only, so the target is said.
          swift build --package-path app --triple arm64-apple-macosx26.0
          swift build --package-path helpers/acmd-speech --target SpeechCore --triple arm64-apple-macosx26.0
      - name: build the speech helper with MLX (main and weekly)
        if: matrix.language == 'swift' && github.event_name != 'pull_request'
        run: swift build --package-path helpers/acmd-speech --triple arm64-apple-macosx26.0
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results
      # The speech helper's full build compiles its dependencies (in .build/), and
      # their findings aren't ours to fix: they're left out.
      - name: leave out findings in dependencies
        run: |
          for f in sarif-results/*.sarif; do
            jq '(.runs[].results) |= map(select((.locations[0].physicalLocation.artifactLocation.uri // "") | test("(^|/)\\.build/") | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
