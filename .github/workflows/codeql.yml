# CodeQL code scanning, in place of GitHub's default setup. That one's Swift
# autobuild couldn't build the app (it has no Ghostty library), so it scanned
# the speech helper's dependencies instead.
#
# It runs once a day, at 01:00 South African time (23:00 UTC), and when started
# by hand: not on PRs or pushes. The Swift scan holds a Mac runner for 25 to 60
# minutes, most of it the build under CodeQL's tracer (which runs it under
# Rosetta), and a scan on every PR took Mac runners from CI and the release.
# A finding shows the morning after the merge instead of on the PR.
#
# Swift builds the app on the prebuilt Ghostty libraries and the speech helper
# with MLX. Go is analyzed twice, once as macOS builds it (GOOS=darwin) and once
# as Linux does, so the files only one of them compiles are scanned too. Both
# run on a Linux runner, which keeps the Mac runners free.
name: codeql

on:
  schedule:
    - cron: "0 23 * * *" # 01:00 in South Africa (UTC+2, no daylight saving)
  workflow_dispatch:

permissions:
  contents: read

# A scan that has started is left to finish: a cancelled one leaves the code
# scanning baseline out of date.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What to scan: each scan needs its own category, or one would replace the other.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: list the languages to scan
        id: plan
        run: |
          # name is what the job is called, and category is where its results go.
          matrix="$(jq -cn '{include: [
              {name: "actions", language: "actions", category: "/language:actions", "build-mode": "none", runner: "ubuntu-latest"},
              {name: "go", language: "go", goos: "darwin", category: "/language:go", "build-mode": "autobuild", runner: "ubuntu-latest"},
              {name: "go, Linux", language: "go", goos: "linux", category: "/language:go-linux", "build-mode": "autobuild", runner: "ubuntu-latest"},
              {name: "swift", language: "swift", category: "/language:swift", "build-mode": "manual", runner: "macos-26"}
            ]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.language == 'swift' && 75 || 20 }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Before CodeQL starts watching: the Ghostty libraries aren't ours to scan.
      # The pinned, hash-checked prebuilt ones, as CI and the release use: building
      # them took 10 minutes whenever their cache had been evicted.
      - if: matrix.language == 'swift'
        uses: ./.github/actions/macos-tools
        with:
          ghostty: "prebuilt"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
      - name: build the app and the speech helper's own code
        if: matrix.language == 'swift'
        run: |
          # CodeQL's tracer runs the build under Rosetta, as x86_64; the Ghostty
          # library is arm64 only, so the target is said.
          swift build --package-path app --triple arm64-apple-macosx26.0
          swift build --package-path helpers/acmd-speech --target SpeechCore --triple arm64-apple-macosx26.0
      - name: build the speech helper with MLX
        if: matrix.language == 'swift'
        run: swift build --package-path helpers/acmd-speech --triple arm64-apple-macosx26.0
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: ${{ matrix.category }}
          upload: never
          output: sarif-results
      # The speech helper's full build compiles its dependencies (in .build/), and
      # their findings aren't ours to fix: they're left out.
      - name: leave out findings in dependencies
        run: |
          for f in sarif-results/*.sarif; do
            jq '(.runs[].results) |= map(select((.locations[0].physicalLocation.artifactLocation.uri // "") | test("(^|/)\\.build/") | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: ${{ matrix.category }}
