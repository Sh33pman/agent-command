# Release pipeline:
#   1. release-please keeps a release PR open. Merging it tags vX.Y.Z and
#      creates the GitHub Release as a draft.
#   2. In the same workflow (tags created by tokens don't trigger workflows):
#      gate, build, build-linux and build-windows run side by side on the tag.
#      gate runs every check, with no secrets. build builds and signs the app
#      and acmd for macOS from source, packs acmd for the formula, and attests
#      both. build-linux builds acmd for Linux from source, tests it, and
#      attests it. build-windows builds acmd's Windows zips for Scoop, and
#      attests them.
#   3. publish, once all pass: the tap release, the cask, the formula, a check
#      of what Homebrew downloads, the Scoop manifest and a check of what Scoop
#      downloads, and last, publishing the draft. "Released" means the app and
#      acmd can be installed.
# If any of them fails, failed marks the draft. It never becomes public, and
# "Re-run failed jobs" finishes the release: each job is safe to run again.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: brettmostert
          repositories: agent-command
          permission-contents: write
          permission-pull-requests: write
      # release-please-config.json sets draft and force-tag-creation: the tag
      # is created now, as the jobs below check it out, and the release stays a
      # draft until publish.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Every check, on the exact release commit. No secrets, so caches are fine.
  # The Ghostty libraries are the prebuilt ones build ships, so the checks run
  # against what is released.
  gate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "prebuilt"
          speech: "true"
      # With the Ghostty libraries installed, make ci runs the libghostty and app
      # tests too.
      - name: lint, test, vuln, the libghostty and app tests, build
        run: make ci
      - name: fuzz
        run: make fuzz FUZZTIME=30s

  # A clean build, signed. No test code runs here, and nothing comes from a
  # cache: Go and the speech helper are built from source, and the Ghostty
  # libraries are the prebuilt ones, checked against the SHA-256 in
  # scripts/ghostty-prebuilt.pin.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "prebuilt"
          speech: "true"
          cache: "false"

      - name: import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.ACMD_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.ACMD_SIGNING_PASSWORD }}
        # Sets KEYCHAIN and ACMD_SIGN_IDENTITY (the certificate's SHA-1).
        run: scripts/import-signing-cert.sh "$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"

      - name: build and sign the app
        env:
          ACMD_SIGN_KEYCHAIN: ${{ env.KEYCHAIN }}
          ACMD_VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/build-app.sh

      - name: check the app
        run: |
          codesign --verify --strict "dist/Agent Command.app"
          codesign -dvv "dist/Agent Command.app" 2>&1 | grep -F "Authority=Agent Command Self-Signed"
          # acmd is the formula's: none is left in the app.
          test ! -e "dist/Agent Command.app/Contents/MacOS/agent-command"
          codesign --verify --strict dist/agent-command dist/acmd-speech
          dist/agent-command version | grep -F "$VERSION"
          dist/acmd-speech --version

      # The formula's archive: the signed acmd and speech engine, as they are.
      - name: pack acmd for the formula
        run: scripts/pack-acmd.sh "$VERSION" dist dist

      - name: checksums
        run: cd dist && shasum -a 256 AgentCommand.zip "acmd-$VERSION-darwin-arm64.tar.gz" > checksums-app.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/AgentCommand.zip
            dist/acmd-*-darwin-arm64.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-app
          path: |
            dist/AgentCommand.zip
            dist/acmd-*-darwin-arm64.tar.gz
            dist/checksums-app.txt
          if-no-files-found: error
          overwrite: true

      - name: remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  # acmd for Linux, for the formula: one static binary per architecture, with
  # libghostty-vt. Nothing comes from a cache: Go is set up without one, and
  # Ghostty is built from the pinned source into an empty folder. No secrets.
  build-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # the build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: build libghostty-vt from source
        run: ACMD_GHOSTTY_CACHE="$RUNNER_TEMP/ghostty" scripts/build-ghostty.sh
      - name: test with libghostty-vt
        run: make test-vt
      - name: build and pack acmd
        run: scripts/pack-acmd.sh "$VERSION" dist
      - name: checksums
        run: cd dist && sha256sum "acmd-$VERSION-linux-$ARCH.tar.gz" > "checksums-linux-$ARCH.txt"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/acmd-*-linux-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/acmd-*-linux-*.tar.gz
            dist/checksums-linux-*.txt
          if-no-files-found: error
          overwrite: true

  # acmd for Windows, for Scoop: acmd.exe and its logon task's launcher,
  # acmdw.exe, cross-compiled with cgo off (no libghostty-vt: Windows hosts no
  # sessions). Go comes from no cache. No secrets.
  build-windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build and pack acmd for Windows
        run: scripts/pack-windows.sh "$VERSION" dist
      - name: checksums
        run: cd dist && sha256sum acmd-"$VERSION"-windows-*.zip > checksums-windows.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/acmd-*-windows-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/acmd-*-windows-*.zip
            dist/checksums-windows.txt
          if-no-files-found: error
          overwrite: true

  # Only gh, git and the API from here. The App token, for the tap and the
  # Scoop bucket only, is made just before the steps that use it. This repo
  # uses GITHUB_TOKEN.
  publish:
    needs: [release-please, gate, build, build-linux, build-windows]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write # read the draft release's notes, and publish it
      attestations: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAP_REPO: brettmostert/homebrew-tap
      SCOOP_REPO: brettmostert/scoop-bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # Every file each build made, checked against its checksums and its
      # attestation, then one checksums.txt for the tap release.
      - name: check the builds and their provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for sums in checksums-app.txt checksums-linux-amd64.txt checksums-linux-arm64.txt checksums-windows.txt; do
            shasum -a 256 -c "$sums"
          done
          for file in AgentCommand.zip "acmd-$VERSION-darwin-arm64.tar.gz" "acmd-$VERSION-linux-amd64.tar.gz" "acmd-$VERSION-linux-arm64.tar.gz" \
            "acmd-$VERSION-windows-amd64.zip" "acmd-$VERSION-windows-arm64.zip"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          cat checksums-app.txt checksums-linux-amd64.txt checksums-linux-arm64.txt checksums-windows.txt > checksums.txt
          rm checksums-*.txt

      - name: read the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          scripts/release.sh notes "$TAG" > build/notes.md

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: brettmostert
          repositories: homebrew-tap,scoop-bucket
          permission-contents: write

      # The tap release, the cask and the formula, then a check that what
      # Homebrew downloads matches their SHA-256s.
      - name: publish the app and acmd to the tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/release.sh tap "$VERSION" dist build/notes.md

      # Last before the draft: the manifest points at the tap release's zips.
      - name: publish acmd to the Scoop bucket
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/release.sh scoop "$VERSION" dist

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh publish "$TAG"

  # Runs when gate, build, build-linux, build-windows or publish fails, or the run is cancelled. The draft
  # stays a draft, retitled [FAILED], with a note on what reached the tap.
  failed:
    needs: [release-please, gate, build, build-linux, build-windows, publish]
    if: (failure() || cancelled()) && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      TAP_REPO: brettmostert/homebrew-tap
      SCOOP_REPO: brettmostert/scoop-bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: mark the draft release as failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          scripts/release.sh failed "$TAG" "$run_url"
