# Release pipeline:
#   1. release-please keeps a release PR open. Merging it tags vX.Y.Z and
#      creates the GitHub Release as a draft.
#   2. In the same workflow (tags created by tokens don't trigger workflows):
#      gate and build run side by side on the tag. gate runs every check, with
#      no secrets. build builds and signs the app from source, and attests it.
#   3. publish, once both pass: the tap release, the cask, a check of what
#      Homebrew downloads, and last, publishing the draft. "Released" means the
#      app can be installed.
# If any of them fails, failed marks the draft. It never becomes public, and
# "Re-run failed jobs" finishes the release: each job is safe to run again.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: brettmostert
          repositories: agent-command
          permission-contents: write
          permission-pull-requests: write
      # release-please-config.json sets draft and force-tag-creation: the tag
      # is created now, as the jobs below check it out, and the release stays a
      # draft until publish.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Every check, on the exact release commit. No secrets, so caches are fine.
  gate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"
          speech: "true"
      - name: lint, test, vuln, build
        run: make ci
      - name: fuzz
        run: make fuzz FUZZTIME=30s
      - name: test with libghostty, and test the app
        run: make test-vt test-app

  # A clean build, signed. No test code runs here, and Go and the speech helper
  # are built from source, not restored from a cache.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"
          speech: "true"
          cache: "false"

      - name: import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.ACMD_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.ACMD_SIGNING_PASSWORD }}
        # Sets KEYCHAIN and ACMD_SIGN_IDENTITY (the certificate's SHA-1).
        run: scripts/import-signing-cert.sh "$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"

      - name: build and sign the app
        env:
          ACMD_SIGN_KEYCHAIN: ${{ env.KEYCHAIN }}
          ACMD_VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/build-app.sh

      - name: check the app
        run: |
          codesign --verify --strict "dist/Agent Command.app"
          codesign -dvv "dist/Agent Command.app" 2>&1 | grep -F "Authority=Agent Command Self-Signed"
          "dist/Agent Command.app/Contents/MacOS/agent-command" version | grep -F "$VERSION"
          "dist/Agent Command.app/Contents/MacOS/acmd-speech" --version

      - name: checksums
        run: cd dist && shasum -a 256 AgentCommand.zip > checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/AgentCommand.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-app
          path: |
            dist/AgentCommand.zip
            dist/checksums.txt
          if-no-files-found: error
          overwrite: true

      - name: remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  # Only gh, git and the API from here. The App token, for the tap only, is
  # made just before the step that uses it. This repo uses GITHUB_TOKEN.
  publish:
    needs: [release-please, gate, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write # read the draft release's notes, and publish it
      attestations: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAP_REPO: brettmostert/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-app
          path: dist

      - name: check the build and its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && shasum -a 256 -c checksums.txt)
          gh attestation verify dist/AgentCommand.zip --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: read the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          scripts/release.sh notes "$TAG" > build/notes.md

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: brettmostert
          repositories: homebrew-tap
          permission-contents: write

      # The tap release, the cask, then a check that the zip Homebrew downloads
      # matches the cask's SHA-256.
      - name: publish the app to the tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/release.sh tap "$VERSION" dist build/notes.md

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh publish "$TAG"

  # Runs when gate, build or publish fails, or the run is cancelled. The draft
  # stays a draft, retitled [FAILED], with a note on what reached the tap.
  failed:
    needs: [release-please, gate, build, publish]
    if: (failure() || cancelled()) && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      TAP_REPO: brettmostert/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: mark the draft release as failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          scripts/release.sh failed "$TAG" "$run_url"
