# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release builds for macOS (SPEC §13.4). Release notes come from release-please,
# so the changelog is disabled here and the existing GitHub Release is kept.
version: 2

project_name: agent-command

builds:
  - id: agent-command
    main: ./cmd/agent-command
    binary: agent-command
    env:
      - CGO_ENABLED=1 # the reply popup is a native AppKit panel (SPEC §8.8)
    goos: [darwin]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/brettmostert/agent-command/internal/version.Version={{ .Version }}
      - -X github.com/brettmostert/agent-command/internal/version.Commit={{ .FullCommit }}
      - -X github.com/brettmostert/agent-command/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: agent-command-universal
    ids: [agent-command]
    name_template: agent-command
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [agent-command, agent-command-universal]
    formats: [tar.gz]
    # darwin_arm64, darwin_amd64, darwin_all (universal)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  github:
    owner: brettmostert
    name: agent-command
  mode: keep-existing
  draft: false
