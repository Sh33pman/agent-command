# Managed by acmd (agent-command). Regenerated by `acmd init`; removed by `acmd uninstall`.
allow_remote_control socket-only
listen_on unix:kitty-acmd-{kitty_pid}
map cmd+shift+b launch --type=background --allow-remote-control /opt/homebrew/bin/acmd toggle --kitty-window @active-kitty-window-id
map cmd+shift+n launch --type=background --allow-remote-control /opt/homebrew/bin/acmd new --kitty-window @active-kitty-window-id
map cmd+shift+s launch --type=background --allow-remote-control /opt/homebrew/bin/acmd focus --kitty-window @active-kitty-window-id
map cmd+shift+a launch --type=background --allow-remote-control /opt/homebrew/bin/acmd next-attention --kitty-window @active-kitty-window-id
map cmd+shift+l launch --type=overlay /opt/homebrew/bin/acmd pick
# skipped cmd+shift+k (keys): conflicts with Kitty's default something
# skipped cmd+shift+e (open): conflicts with your `map cmd+shift+e launch --type=tab my-editor`
map ctrl+cmd+1 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 1 --kitty-window @active-kitty-window-id
map ctrl+cmd+2 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 2 --kitty-window @active-kitty-window-id
map ctrl+cmd+3 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 3 --kitty-window @active-kitty-window-id
map ctrl+cmd+4 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 4 --kitty-window @active-kitty-window-id
map ctrl+cmd+5 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 5 --kitty-window @active-kitty-window-id
map ctrl+cmd+6 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 6 --kitty-window @active-kitty-window-id
map ctrl+cmd+7 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 7 --kitty-window @active-kitty-window-id
map ctrl+cmd+8 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 8 --kitty-window @active-kitty-window-id
map ctrl+cmd+9 launch --type=background --allow-remote-control /opt/homebrew/bin/acmd go 9 --kitty-window @active-kitty-window-id
